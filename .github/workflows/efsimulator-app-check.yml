name: eFsimulator app checks
on:
  push:
    branches: [api-server-setup]
    paths: ['services/efsimulator-app/**', '.github/workflows/efsimulator-app-check.yml']
  pull_request:
    paths: ['services/efsimulator-app/**', '.github/workflows/efsimulator-app-check.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/efsimulator-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: node --test tests/*.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
